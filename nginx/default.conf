limit_req_zone $binary_remote_addr zone=room_ops:10m rate=10r/m;
upstream bingo_backend { server backend:4000; }
server {
  listen 80;
  location /health { proxy_pass http://bingo_backend; }
  location /socket.io/ {
    proxy_pass http://bingo_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }
  location / { limit_req zone=room_ops burst=20 nodelay; proxy_pass http://bingo_backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
