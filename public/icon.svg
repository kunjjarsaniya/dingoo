<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Paper shadow -->
    <filter id="paperShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1e1815" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e1815" flood-opacity="0.08" />
    </filter>
    <!-- Tactile bevel -->
    <linearGradient id="coralGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B53" />
      <stop offset="100%" stop-color="#EA3E24" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#F1ECE4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFCF4B" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="mintGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Base Squircle Card with Drop Shadow -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#coralGrad)" filter="url(#paperShadow)" />
  
  <!-- Tactile Inner Paper Layer -->
  <rect x="52" y="52" width="408" height="408" rx="92" fill="url(#paperGrad)" />

  <!-- Subtle grid texture (Bingo grid homage) -->
  <line x1="160" y1="84" x2="160" y2="428" stroke="#1e1815" stroke-opacity="0.06" stroke-width="3" stroke-dasharray="6 6" />
  <line x1="256" y1="84" x2="256" y2="428" stroke="#1e1815" stroke-opacity="0.06" stroke-width="3" stroke-dasharray="6 6" />
  <line x1="352" y1="84" x2="352" y2="428" stroke="#1e1815" stroke-opacity="0.06" stroke-width="3" stroke-dasharray="6 6" />
  <line x1="84" y1="160" x2="428" y2="160" stroke="#1e1815" stroke-opacity="0.06" stroke-width="3" stroke-dasharray="6 6" />
  <line x1="84" y1="256" x2="428" y2="256" stroke="#1e1815" stroke-opacity="0.06" stroke-width="3" stroke-dasharray="6 6" />
  <line x1="84" y1="352" x2="428" y2="352" stroke="#1e1815" stroke-opacity="0.06" stroke-width="3" stroke-dasharray="6 6" />

  <!-- Bold Playful "D" Character -->
  <path d="M148 136 C148 127.163 155.163 120 164 120 H248 C324 120 376 172 376 256 C376 340 324 392 248 392 H164 C155.163 392 148 384.837 148 376 V136 Z M220 184 V328 H248 C288 328 312 298 312 256 C312 214 288 184 248 184 H220 Z" 
        fill="#1E1815" />

  <!-- 3 Tactile Floating Bingo Dot Chips inside/around "D" -->
  <!-- Top Gold Chip -->
  <circle cx="360" cy="144" r="30" fill="url(#goldGrad)" />
  <circle cx="360" cy="144" r="28" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3" />
  <text x="360" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#78350F" text-anchor="middle">7</text>

  <!-- Middle Coral Chip in D center -->
  <circle cx="266" cy="256" r="34" fill="url(#coralGrad)" />
  <circle cx="266" cy="256" r="32" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3" />
  <text x="266" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">B</text>

  <!-- Bottom Mint Chip -->
  <circle cx="160" cy="384" r="26" fill="url(#mintGrad)" />
  <circle cx="160" cy="384" r="24" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3" />
  <text x="160" y="391" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">★</text>

  <!-- Curled corner accent bottom right -->
  <path d="M410 460 L460 410 C445 425 435 445 410 460 Z" fill="#D3C9BD" opacity="0.6" />
</svg>
