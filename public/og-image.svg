<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="ogShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#1e1815" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e1815" flood-opacity="0.08" />
    </filter>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#F2ECE3" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B53" />
      <stop offset="100%" stop-color="#EA3E24" />
    </linearGradient>
    <linearGradient id="honeyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD159" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="mintGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Subtle Torn Paper Top & Bottom Border -->
  <path d="M0 0 H1200 V16 L1180 8 L1160 16 L1140 8 L1120 16 L1100 8 L1080 16 L1060 8 L1040 16 L1020 8 L1000 16 L980 8 L960 16 L940 8 L920 16 L900 8 L880 16 L860 8 L840 16 L820 8 L800 16 L780 8 L760 16 L740 8 L720 16 L700 8 L680 16 L660 8 L640 16 L620 8 L600 16 L580 8 L560 16 L540 8 L520 16 L500 8 L480 16 L460 8 L440 16 L420 8 L400 16 L380 8 L360 16 L340 8 L320 16 L300 8 L280 16 L260 8 L240 16 L220 8 L200 16 L180 8 L160 16 L140 8 L120 16 L100 8 L80 16 L60 8 L40 16 L20 8 L0 16 Z" fill="#EAE4DA" />

  <!-- Left Content Area -->
  <g transform="translate(100, 110)">
    <!-- Badge -->
    <rect width="260" height="40" rx="20" fill="#EAE3D6" />
    <circle cx="24" cy="20" r="8" fill="#EA3E24" />
    <text x="44" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#28221E" letter-spacing="1">REAL-TIME MULTIPLAYER</text>

    <!-- Main Wordmark -->
    <text x="0" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="900" fill="#1E1815" letter-spacing="-2">dingoo<tspan fill="#EA3E24">.</tspan></text>

    <!-- Tagline -->
    <text x="0" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#3D352F">Play a little. Win a round.</text>
    <text x="0" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#6A625A">Instant room sync • 40s turn timers • Custom 5x5 to 10x10 cards</text>

    <!-- Domain Pill -->
    <rect x="0" y="320" width="310" height="52" rx="26" fill="#1E1815" />
    <text x="32" y="353" font-family="ui-monospace, monospace" font-size="19" font-weight="700" fill="#FAF8F5">dingoo.vercel.app</text>
  </g>

  <!-- Right Side: Beautiful Tactile Bingo Card Illustration -->
  <g transform="translate(740, 90)" filter="url(#ogShadow)">
    <!-- Lavender back sheet -->
    <rect x="25" y="15" width="360" height="440" rx="36" fill="#E2DEFA" transform="rotate(4 205 235)" />
    <!-- Main Paper Card -->
    <rect x="0" y="0" width="360" height="440" rx="32" fill="#FAF8F5" stroke="#E3DDD4" stroke-width="2" />
    
    <!-- Bingo Header Tabs -->
    <rect x="24" y="28" width="56" height="34" rx="8" fill="#FF6B53" />
    <text x="52" y="52" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">B</text>

    <rect x="88" y="28" width="56" height="34" rx="8" fill="#FBBF24" />
    <text x="116" y="52" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">I</text>

    <rect x="152" y="28" width="56" height="34" rx="8" fill="#34D399" />
    <text x="180" y="52" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">N</text>

    <rect x="216" y="28" width="56" height="34" rx="8" fill="#60A5FA" />
    <text x="244" y="52" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">G</text>

    <rect x="280" y="28" width="56" height="34" rx="8" fill="#F472B6" />
    <text x="308" y="52" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">O</text>

    <!-- Grid of cells -->
    <!-- Row 1 -->
    <rect x="24" y="80" width="56" height="56" rx="14" fill="#F3EEE6" />
    <text x="52" y="116" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#28221E" text-anchor="middle">7</text>

    <rect x="88" y="80" width="56" height="56" rx="14" fill="#F3EEE6" />
    <text x="116" y="116" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#28221E" text-anchor="middle">19</text>

    <rect x="152" y="80" width="56" height="56" rx="14" fill="#EA3E24" />
    <text x="180" y="116" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">32</text>

    <rect x="216" y="80" width="56" height="56" rx="14" fill="#F3EEE6" />
    <text x="244" y="116" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#28221E" text-anchor="middle">48</text>

    <rect x="280" y="80" width="56" height="56" rx="14" fill="#F3EEE6" />
    <text x="308" y="116" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#28221E" text-anchor="middle">65</text>

    <!-- Row 2 (Matched Line Demo) -->
    <rect x="24" y="146" width="56" height="56" rx="14" fill="#EA3E24" />
    <text x="52" y="182" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">12</text>

    <rect x="88" y="146" width="56" height="56" rx="14" fill="#EA3E24" />
    <text x="116" y="182" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">24</text>

    <rect x="152" y="146" width="56" height="56" rx="14" fill="#EA3E24" />
    <text x="180" y="182" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">★</text>

    <rect x="216" y="146" width="56" height="56" rx="14" fill="#EA3E24" />
    <text x="244" y="182" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">51</text>

    <rect x="280" y="146" width="56" height="56" rx="14" fill="#EA3E24" />
    <text x="308" y="182" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">70</text>

    <!-- Row 3 -->
    <rect x="24" y="212" width="56" height="56" rx="14" fill="#F3EEE6" />
    <text x="52" y="248" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#28221E" text-anchor="middle">3</text>

    <rect x="88" y="212" width="56" height="56" rx="14" fill="#F3EEE6" />
    <text x="116" y="248" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#28221E" text-anchor="middle">18</text>

    <rect x="152" y="212" width="56" height="56" rx="14" fill="#F3EEE6" />
    <text x="180" y="248" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#28221E" text-anchor="middle">41</text>

    <rect x="216" y="212" width="56" height="56" rx="14" fill="#EA3E24" />
    <text x="244" y="248" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">59</text>

    <rect x="280" y="212" width="56" height="56" rx="14" fill="#F3EEE6" />
    <text x="308" y="248" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#28221E" text-anchor="middle">63</text>

    <!-- Curled corner accent -->
    <path d="M300 440 L360 380 C345 398 335 418 300 440 Z" fill="#D8CFBF" />
  </g>
</svg>
